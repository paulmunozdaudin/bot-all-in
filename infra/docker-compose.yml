services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: football_ai
      POSTGRES_PASSWORD: football_ai
      POSTGRES_DB: football_ai
    ports:
      - "5432:5432"
    volumes:
      - football_ai_db_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://football_ai:football_ai@db:5432/football_ai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  football_ai_db_data:
